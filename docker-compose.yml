services:
  redis:
    image: redis:alpine
    container_name: searxng-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks:
      - searxng-net

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    depends_on:
      - redis
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./searxng_docker_settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
      - SEARXNG_SECRET_KEY=${SEARXNG_SECRET_KEY:-$(openssl rand -hex 32)}
    networks:
      - searxng-net

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - searxng-net
    environment:
      - OLLAMA_KEEP_ALIVE=24h

volumes:
  redis-data:
  ollama_data:

networks:
  searxng-net:
